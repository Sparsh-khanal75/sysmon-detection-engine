name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest -r requirements.txt
      - run: pytest -q
      - name: Sample run flags the malicious samples (exit code 2 = detections)
        run: |
          set +e
          python hunt.py --list-rules
          python hunt.py samples/attack_chain.jsonl --json alerts.json
          test $? -eq 2
