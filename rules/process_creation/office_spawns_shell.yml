id: 68049fed-da7e-56dd-9c52-7dc4145e2253
title: Office Application Spawning Script Interpreter
level: high
description: A Microsoft Office process started a shell or script host. Typical of a malicious macro in a phishing attachment.
tags: [attack.initial-access, attack.execution, attack.t1566.001, attack.t1204.002]
logsource: {product: windows, service: sysmon, event_ids: [1]}
detection:
  parent:
    ParentImage|endswith: ['\winword.exe', '\excel.exe', '\powerpnt.exe', '\outlook.exe', '\onenote.exe']
  child:
    Image|endswith: ['\cmd.exe', '\powershell.exe', '\pwsh.exe', '\wscript.exe', '\cscript.exe', '\mshta.exe', '\rundll32.exe', '\regsvr32.exe']
  condition: parent and child
falsepositives: [Legitimate Office add-ins that shell out (rare; baseline first)]
