id: 6e0bc707-8ed4-563d-942f-f8e105152c9b
title: Volume Shadow Copy Deletion or Recovery Disabled
level: critical
description: Deleting shadow copies or disabling recovery is a near-universal step before ransomware encryption.
tags: [attack.impact, attack.t1490]
logsource: {product: windows, service: sysmon, event_ids: [1]}
detection:
  vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all: ['delete', 'shadows']
  wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all: ['shadowcopy', 'delete']
  bcdedit:
    Image|endswith: '\bcdedit.exe'
    CommandLine|contains: ['recoveryenabled no', 'bootstatuspolicy ignoreallfailures']
  condition: vssadmin or wmic or bcdedit
falsepositives: [Backup software rotating snapshots - rare from an interactive session]
